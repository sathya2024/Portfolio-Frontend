<app-nav></app-nav>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card mt-5">
        <!-- Updated Header with #004c6a -->
        <div class="card-header text-white text-center" style="background-color: #004c6a;">
          <p class="mb-0">Login to your account</p>
        </div>
        <div class="card-body">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="alert alert-danger" *ngIf="error">
              {{ error }}
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                formControlName="email"
                [ngClass]="{
                  'is-invalid':
                    loginForm.get('email')?.touched &&
                    loginForm.get('email')?.invalid
                }"
              />
              <div
                class="invalid-feedback"
                *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']"
              >
                Email is required
              </div>
              <div
                class="invalid-feedback"
                *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']"
              >
                Enter a valid email address
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                formControlName="password"
                [ngClass]="{
                  'is-invalid':
                    loginForm.get('password')?.touched &&
                    loginForm.get('password')?.invalid
                }"
              />
              <div
                class="invalid-feedback"
                *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']"
              >
                Password is required
              </div>
            </div>

            <!-- Updated Button with #004c6a -->
            <div class="d-flex justify-content-center">
              <button
                type="submit"
                class="btn"
                [disabled]="loginForm.invalid || loading"
                style="background-color: #004c6a; color: white; width: 150px; height: 40px;"
              >
                <span
                  *ngIf="loading"
                  class="spinner-border spinner-border-sm me-1"
                  role="status"
                  aria-hidden="true"
                ></span>
                Login
              </button>
            </div>

            <div class="mt-3 text-center">
              <a [routerLink]="['/forgot-password']">Forgot Password?</a>
            </div>

            <hr />

            <div class="text-center">
              <p>
                Don't have an account? <a [routerLink]="['/signup']">Sign Up</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br />
<app-footer></app-footer>
